AWSTemplateFormatVersion: '2010-09-09'
Description: >
  digitized-image-qc

  Supports quality control of digitized still image and textual assets.

Mappings:
  MsApp:
    RedirectUri:
      dev: https://digitized-image-qc.dev.rockarch.org/microsoft_authentication/callback
      prod: https://digitized-image-qc.rockarch.org/microsoft_authentication/callback
    LogoutUri:
      dev: https://digitized-image-qc.dev.rockarch.org
      prod: https://digitized-image-qc.rockarch.org

Parameters:
  ContainerAccountId:
    Type: String
    Description: Account ID under which container repository is located.
    Default: "817658541382"
  ApplicationEnvironment:
    Type: String
    Description: Environment in which application should be deployed.
    AllowedValues:
      - dev
      - prod
  ApplicationName:
    Type: String
    Description: Name of the application to be deployed.
  ApplicationHostName:
    Type: String
    Description: Hostname of the application to be deployed.
  EcsClusterName:
    Type: String
    Description: Name of the ECS Cluster in which service should be deployed.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet in which service should run.
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for service.
  SourceBucketName:
    Type: String
    Description: Name of bucket in which source files are stored.
  ArchivesSpaceRepo:
    Type: String
    Description: ArchivesSpace repository identifier.
  ArchivesSpaceBaseUrl:
    Type: String
    Description: ArchivesSpace base URL.
  ArchivesSpaceUsername:
    Type: String
    Description: ArchivesSpace username.
  ArchivesSpacePassword:
    Type: String
    Description: ArchivesSpace password.
  SqlDatabaseName:
    Type: String
    Description: Name of database.
    Default: digitized_image_qc_db
  SqlDatabasePort:
    Type: Number
    Description: Port at which SQL database is available.
    Default: 5432
  SqlVersion:
    Type: String
    Description: Version of the SQL engine to use.
    Default: '15.12'
  TargetGroupArn:
    Type: String
    Description: ARN for Target Group on load balancer.
  DatabaseSubnetGroup:
    Type: String
    Description: Database subnet group for cluster and instance.
  Workload:
    Type: String
    Description: Name of workload for this stack.
  MsAppId:
    Type: String
    Description: Microsoft App ID.
  MsAppSecret:
    Type: String
    Description: Microsoft App secret.
  MsAppAuthority:
    Type: String
    Description: URI for Microsoft App tenant login.
  MsAppValidEmailDomains:
    Type: String
    Description: Valid email domains for Microsoft App.
    Default: '["rockarch.org"]'

Resources:  
  ArchivesSpaceRepoParameter:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: ArchivesSpace repository identifier.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/AS_REPO
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref ArchivesSpaceRepo
  ArchivesSpaceBaseUrlParameter:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: ArchivesSpace base URL.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/AS_BASEURL
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref ArchivesSpaceBaseUrl
  ArchivesSpaceUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: ArchivesSpace username.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/AS_USERNAME
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref ArchivesSpaceUsername
  ArchivesSpacePasswordParameter:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: ArchivesSpace password.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/AS_PASSWORD
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref ArchivesSpacePassword

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: LogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: 
                  - !GetAtt QcLogGroup.Arn
        - PolicyName: EcrPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchGetImage'
                Resource: 
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${ContainerAccountId}:repository/${ApplicationName}
              - Effect: Allow
                Action:
                  - 'ecr:GetAuthorizationToken'
                Resource: "*"
        - PolicyName: SSMPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssm:GetParameters'
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ApplicationEnvironment}/${ApplicationName}/*


  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: DescribeLogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:DescribeLogGroups'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
        - PolicyName: LogEventPolicy
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:DescribeLogStreams'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ecs/${EcsClusterName}:*'
        - PolicyName: SSMPolicy
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssmmessages:CreateControlChannel'
                  - 'ssmmessages:CreateDataChannel'
                  - 'ssmmessages:OpenControlChannel'
                  - 'ssmmessages:OpenDataChannel'
                Resource: '*'
  
  DigitizedImageQcUser:
    Type: AWS::IAM::User
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing

  DigitizedImageQcUserAccessKey:
    Type: AWS::IAM::AccessKey
    Properties: 
      UserName: !Ref DigitizedImageQcUser

  DigitizedImageQcUserIdParameter:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: Secret Access Key ID for DigitizedImageQcUser.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/AWS_ACCESS_KEY_ID
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !Ref DigitizedImageQcUserAccessKey

  DigitizedImageQcUserKeyParameter:
    Type: AWS::SSM::Parameter
    Properties: 
      Description: Secret Access Key for DigitizedImageQcUser.
      Name: !Sub /${ApplicationEnvironment}/${ApplicationName}/AWS_SECRET_ACCESS_KEY
      Tags: 
        Environment: !Ref ApplicationEnvironment
        Application: !Ref ApplicationName
        Workload: !Ref Workload
        WorkloadType: processing
      Type: String
      Value: !GetAtt DigitizedImageQcUserAccessKey.SecretAccessKey

  DigitizedImageQcUserPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: S3Policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 's3:GetObject'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${SourceBucketName}/*'
          - Effect: Allow
            Action:
              - 's3:ListBucket'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${SourceBucketName}'
      Users:
        - !Ref DigitizedImageQcUser

  DigitizedImageQcRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      RoleName: digitized-image-qc-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !GetAtt DigitizedImageQcUser.Arn
            Action:
              - 'sts:AssumeRole'
      Description: 'Allows creation of SNS messages.'
      Policies:
        - PolicyName: DigitizedImageQcSNSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'sns:Publish'
                Resource: !ImportValue DigitizedImage-SNSTopicArn
        - PolicyName: DigitizedImageQcSSMPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - 'ssm:GetParametersByPath'
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ApplicationEnvironment}/${ApplicationName}
        - PolicyName: DigitizedImageQcS3ObjectPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:DeleteObject'
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SourceBucketName}/*'
        - PolicyName: DigitizedImageQcS3BucketPolicy
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:ListBucket'
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SourceBucketName}'
  
  DBSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      Description: 'Secrets for RDS instance'
      GenerateSecretString:
        SecretStringTemplate: '{"username": "digitizedimageqcuser"}'
        GenerateStringKey: 'password'
        PasswordLength: 16
        ExcludeCharacters: '"@/\'

  DBCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      DatabaseName: !Ref SqlDatabaseName
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      Engine: aurora-postgresql
      EngineVersion: !Ref SqlVersion
      Port: !Ref SqlDatabasePort
      MasterUsername: !Join ['', ['{{resolve:secretsmanager:', !Ref DBSecrets, ':SecretString:username}}' ]]
      MasterUserPassword: !Join ['', ['{{resolve:secretsmanager:', !Ref DBSecrets, ':SecretString:password}}' ]]
      ServerlessV2ScalingConfiguration:
        MaxCapacity: 16.0
        MinCapacity: 0.5
      VpcSecurityGroupIds:
        - !Ref SecurityGroupId

  PostgresDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref DBCluster
      Engine: aurora-postgresql
      EngineVersion: !Ref SqlVersion
      PubliclyAccessible: false

  QcLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: 
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      LogGroupName: !Sub "/digitized_image/ecs/${ApplicationName}"
      RetentionInDays: 90
  
  QcECSTask:
    Type: AWS::ECS::TaskDefinition
    Properties: 
      Cpu: "2048"
      Memory: "4096"
      ContainerDefinitions: 
        - Name: !Ref ApplicationName
          Image: !Sub "${ContainerAccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ApplicationName}:${ApplicationEnvironment}"
          Essential: true
          Environment:
            - Name: ENV
              Value: !Ref ApplicationEnvironment
            - Name: APP_CONFIG_PATH
              Value: !Ref ApplicationName
            - Name: ALLOWED_HOSTS
              Value: !Ref ApplicationHostName
            - Name: APPLICATION_PORT
              Value: "80"
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AWS_ROLE_ARN
              Value: !GetAtt DigitizedImageQcRole.Arn
            - Name: AWS_S3_BUCKET
              Value: !Ref SourceBucketName
            - Name: AWS_SNS_TOPIC
              Value: !ImportValue DigitizedImage-SNSTopicArn
            - Name: AQUILA_BASEURL
              Value: http://aquila.rockarch.org
            - Name: SQL_ENGINE
              Value: django.db.backends.postgresql
            - Name: SQL_HOST
              Value: !GetAtt PostgresDatabase.Endpoint.Address
            - Name: SQL_PORT
              Value: !Ref SqlDatabasePort
            - Name: SQL_DB_NAME
              Value: !Ref SqlDatabaseName
            - Name: SQL_DB_USER
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref DBSecrets, ':SecretString:username}}' ]]
            - Name: SQL_DB_PASSWORD
              Value: !Join ['', ['{{resolve:secretsmanager:', !Ref DBSecrets, ':SecretString:password}}' ]]
            - Name: LOGIN_URL
              Value: /microsoft_authentication/login
            - Name: LOGOUT_URL
              Value: /
            - Name: MS_APP_ID
              Value: !Ref MsAppId
            - Name: MS_APP_SECRET
              Value: !Ref MsAppSecret
            - Name: MS_APP_REDIRECT
              Value: !FindInMap [MsApp, RedirectUri, !Ref ApplicationEnvironment]
            - Name: MS_APP_SCOPES
              Value: '["user.read"]'
            - Name: MS_APP_AUTHORITY
              Value: !Ref MsAppAuthority
            - Name: MS_APP_VALID_EMAIL_DOMAINS
              Value: !Ref MsAppValidEmailDomains
            - Name: MS_APP_LOGOUT_URI
              Value: !FindInMap [MsApp, LogoutUri, !Ref ApplicationEnvironment]
          PortMappings:
            - ContainerPort: 80
          Secrets:
            - Name: AWS_ACCESS_KEY_ID
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DigitizedImageQcUserIdParameter}'
            - Name: AWS_SECRET_ACCESS_KEY
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DigitizedImageQcUserKeyParameter}'
          LinuxParameters:
            InitProcessEnabled: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              "awslogs-group": !Ref QcLogGroup
              "awslogs-region": !Ref AWS::Region
              "awslogs-stream-prefix": "ecs"
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      Family: !Ref ApplicationName
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing

  QcECSService:
    Type: AWS::ECS::Service
    Properties: 
      Cluster: !Ref EcsClusterName
      LaunchType: FARGATE
      DesiredCount: 0
      EnableExecuteCommand: true
      Tags:
        - Key: Environment
          Value: !Ref ApplicationEnvironment
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      TaskDefinition: !Ref QcECSTask
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref SubnetId
          SecurityGroups:
            - !Ref SecurityGroupId
      PropagateTags: 'TASK_DEFINITION'
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroupArn
          ContainerPort: 80
          ContainerName: !Ref ApplicationName

Outputs:
  QcECSTask:
    Description: QC ECS Task Definition ARN
    Value: !Ref QcECSTask
  QcECSService:
    Description: QC ECS Service name
    Value: !GetAtt QcECSService.Name
    Export:
      Name:
        DigitizedImage-QcEcsServiceName