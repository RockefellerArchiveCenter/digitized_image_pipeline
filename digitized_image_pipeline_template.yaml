AWSTemplateFormatVersion: '2010-09-09'
Description: >
  digitized-image-pipeline

  Pipeline for transferring, validating and packaging digitized still image and textual assets.

Mappings:
  DeployResources:
    CloudFormationBucket:
      dev: rac-dev-cloudformation-apps
      prod: rac-prod-cloudformation-apps
    CloudFormationBucketPrefix:
      dev: digitized_image_pipeline
      prod: digitized_image_pipeline
    Vpc:
      dev: "vpc-01ff614b4bb3cbbe3"
      prod: "vpc-0a5c0a6d0c14e0e89"
    SecurityGroup:
      dev: "sg-0f98d77d7bb7b4ce6"
      prod: "sg-0a568e8a6ff39b710"
    EcsSecurityGroup:
      dev: sg-0f98d77d7bb7b4ce6
      prod: sg-001d3c3a6ebf7b28a
    Subnet:
      dev: "subnet-098df07b0ab91cb1d"
      prod: "subnet-0102189437e2babd8"
    TargetGroupArn:
      dev: "arn:aws:elasticloadbalancing:us-east-1:016161564811:targetgroup/load-b-Digit-A3QM8KDZHGJZ/3773af57ebe8b9c4"
      prod: "arn:aws:elasticloadbalancing:us-east-1:817658541382:targetgroup/Digiti-Digit-UL5YASMMPJPL/06a6516420ea7524"
  Qc:
    HostName:
      dev: "digitized-image-qc.dev.rockarch.org"
      prod: "digitized-image-qc.rockarch.org"
    DatabaseSubnetGroup:
      dev: "default"
      prod: "default-vpc-0a5c0a6d0c14e0e89"
  Package:
    DestinationBucket:
      dev: "rac-dev-digital-ingest-upload"
      prod: "rac-prod-digital-ingest-upload"
    PdfDestinationBucket:
      dev: "raciif-dev"
      prod: "raciiif-prod"
  ArchivesSpace:
    BaseUrl:
      dev: "https://as.dev.rockarch.org/api"
      prod: "https://as.rockarch.org/api"
    Repo:
      dev: 2
      prod: 2
    Username:
      dev: digitized-image
      prod: digitized-image
  Aquila:
    BaseUrl:
      dev: "http://aquila.rockarch.org/api"
      prod: "http://aquila.rockarch.org/api"
    

Parameters:
  Environment:
    Type: String
    Description: The environment in which the infrastructure should be deployed.
    AllowedValues:
      - dev
      - prod
    Default: dev
  TeamsUrl:
    Type: String
    Description: URL for a Teams channel webhook.
  ArchivesSpacePassword:
    Type: String
    Description: ArchivesSpace password.
  Workload:
    Type: String
    Default: digitized_image_pipeline
    Description: Name of workload for this stack.
  EbsStorageMountPath:
    Type: String
    Default: "/ebs"
    Description: Path at which EBS storage for tasks is mounted.
  MsAppId:
    Type: String
    Description: Microsoft App ID.
  MsAppSecret:
    Type: String
    Description: Microsoft App secret.
  MsAppAuthority:
    Type: String
    Description: URI for Microsoft App tenant login.


Resources:
  # QC Bucket
  QcBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: digitized-image-qc
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing
      BucketName: !Sub rac-${Environment}-image-qc
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  
  # ECS Cluster
  DigitizedImageECSCluster:
    Type: AWS::ECS::Cluster
    Properties: 
      CapacityProviders: 
        - FARGATE
      ClusterName: DigitizedImageCluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags: 
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: digitized-image-ecs-cluster
        - Key: Workload
          Value: !Ref Workload
        - Key: WorkloadType
          Value: processing

  # Notifications Lambda
  NotificationsLambda:
    Type: "AWS::CloudFormation::Stack"
    Properties:
      TemplateURL:
        !Join ["/", 
          [
          "https://s3.amazonaws.com",
          !FindInMap [DeployResources, CloudFormationBucket, !Ref Environment],
          !FindInMap [DeployResources, CloudFormationBucketPrefix, !Ref Environment],
          "digitized_image_notifications_template.yaml"
          ]
        ]
      Parameters:
        ApplicationEnvironment: !Ref Environment
        ApplicationName: digitized_image_notifications
        TeamsUrl: !Ref TeamsUrl
        Workload: !Ref Workload

  # Trigger Lambda
  TriggerLambda:
    Type: "AWS::CloudFormation::Stack"
    DependsOn: 
      - NotificationsLambda
      - QCWebApplication
    Properties:
      TemplateURL:
        !Join ["/", 
          [
          "https://s3.amazonaws.com",
          !FindInMap [DeployResources, CloudFormationBucket, !Ref Environment],
          !FindInMap [DeployResources, CloudFormationBucketPrefix, !Ref Environment],
          "digitized_image_trigger_template.yaml"
          ]
        ]
      Parameters:
        ApplicationEnvironment: !Ref Environment
        ApplicationName: digitized_image_trigger
        ECSClusterName: !Ref DigitizedImageECSCluster
        ECSContainerName: digitized_image_qc
        ECSSubnetName: !FindInMap [DeployResources, Subnet, !Ref Environment]
        ECSSecurityGroupName: !FindInMap [DeployResources, EcsSecurityGroup, !Ref Environment]
        EbsStorageMountPath: !Ref EbsStorageMountPath
        ParentStackName: !Ref AWS::StackName
        Workload: !Ref Workload
        
  # Validate ECS Task
  ValidateECSTask:
    Type: "AWS::CloudFormation::Stack"
    DependsOn:
      - TriggerLambda
      - NotificationsLambda
    Properties:
      TemplateURL:
        !Join ["/", 
          [
          "https://s3.amazonaws.com",
          !FindInMap [DeployResources, CloudFormationBucket, !Ref Environment],
          !FindInMap [DeployResources, CloudFormationBucketPrefix, !Ref Environment],
          "digitized_image_validation_template.yaml"
          ]
        ]
      Parameters:
        ApplicationEnvironment: !Ref Environment
        ApplicationName: digitized_image_validation
        DestinationBucketName: !Ref QcBucket
        EbsStorageMountPath: !Ref EbsStorageMountPath
        Workload: !Ref Workload

  # QC web application
  QCWebApplication:
    Type: "AWS::CloudFormation::Stack"
    DependsOn: NotificationsLambda
    Properties:
      TemplateURL:
        !Join ["/", 
          [
          "https://s3.amazonaws.com",
          !FindInMap [DeployResources, CloudFormationBucket, !Ref Environment],
          !FindInMap [DeployResources, CloudFormationBucketPrefix, !Ref Environment],
          "digitized_image_qc_template.yaml"
          ]
        ]
      Parameters:
        SubnetId: !FindInMap [DeployResources, Subnet, !Ref Environment]
        SecurityGroupId: !FindInMap [DeployResources, EcsSecurityGroup, !Ref Environment]
        ApplicationEnvironment: !Ref Environment
        ApplicationName: digitized_image_qc
        ApplicationHostName: !FindInMap [Qc, HostName, !Ref Environment]
        DatabaseSubnetGroup: !FindInMap [Qc, DatabaseSubnetGroup, !Ref Environment]
        EcsClusterName: !Ref DigitizedImageECSCluster
        SourceBucketName: !Ref QcBucket
        ArchivesSpaceRepo: !FindInMap [ArchivesSpace, Repo, !Ref Environment]
        ArchivesSpaceBaseUrl: !FindInMap [ArchivesSpace, BaseUrl, !Ref Environment]
        ArchivesSpaceUsername: !FindInMap [ArchivesSpace, Username, !Ref Environment]
        ArchivesSpacePassword: !Ref ArchivesSpacePassword
        TargetGroupArn: !FindInMap [DeployResources, TargetGroupArn, !Ref Environment]
        Workload: !Ref Workload
        MsAppId: !Ref MsAppId
        MsAppSecret: !Ref MsAppSecret
        MsAppAuthority: !Ref MsAppAuthority
  
  # Package ECS Task
  PackageECSTask:
    Type: "AWS::CloudFormation::Stack"
    DependsOn: NotificationsLambda
    Properties:
      TemplateURL:
        !Join ["/", 
          [
          "https://s3.amazonaws.com",
          !FindInMap [DeployResources, CloudFormationBucket, !Ref Environment],
          !FindInMap [DeployResources, CloudFormationBucketPrefix, !Ref Environment],
          "digitized_image_packaging_template.yaml"
          ]
        ]
      Parameters:
        ApplicationEnvironment: !Ref Environment
        ApplicationName: digitized_image_packaging
        SourceBucketName: !Ref QcBucket
        DestinationBucketName: !FindInMap [Package, DestinationBucket, !Ref Environment]
        PdfDestinationBucketName: !FindInMap [Package, PdfDestinationBucket, !Ref Environment]
        EbsStorageMountPath: !Ref EbsStorageMountPath
        ArchivesSpaceRepo: !FindInMap [ArchivesSpace, Repo, !Ref Environment]
        ArchivesSpaceBaseUrl: !FindInMap [ArchivesSpace, BaseUrl, !Ref Environment]
        ArchivesSpaceUsername: !FindInMap [ArchivesSpace, Username, !Ref Environment]
        ArchivesSpacePassword: !Ref ArchivesSpacePassword
        AquilaBaseUrl: !FindInMap [Aquila, BaseUrl, !Ref Environment]
        Workload: !Ref Workload